    <text x="70" y="44" text-anchor="middle" fill="#4353cf" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900">07</text>
    <text x="96" y="45" fill="#191c1e" font-family="'Montserrat', sans-serif" font-size="17" font-weight="800">Infrastructure as…</text>
    <text x="60" y="85" fill="#575e70" font-family="'Inter', sans-serif" font-size="14" font-weight="600">⏱ 10 Days</text>
  </g>

  <!-- Phase 08 -->
  <g transform="translate(580, 700)" filter="url(#softShadow)">
    <polygon points="0,0 360,0 400,60 360,120 0,120 40,60" fill="url(#chevronFill)" stroke="#2563eb" stroke-width="3" />
    <rect x="52" y="24" width="36" height="28" rx="6" fill="#eef2ff" />
    <text x="70" y="44" text-anchor="middle" fill="#2563eb" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900">08</text>
    <text x="96" y="45" fill="#191c1e" font-family="'Montserrat', sans-serif" font-size="17" font-weight="800">Microservices &amp; C…</text>
    <text x="60" y="85" fill="#575e70" font-family="'Inter', sans-serif" font-size="14" font-weight="600">⏱ 12 Days</text>
  </g>

  <!-- Phase 09 -->
  <g transform="translate(970, 700)" filter="url(#softShadow)">
    <polygon points="0,0 360,0 400,60 360,120 0,120 40,60" fill="url(#chevronFill)" stroke="#1d4ed8" stroke-width="3" />
    <rect x="52" y="24" width="36" height="28" rx="6" fill="#eef2ff" />
    <text x="70" y="44" text-anchor="middle" fill="#1d4ed8" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900">09</text>
    <text x="96" y="45" fill="#191c1e" font-family="'Montserrat', sans-serif" font-size="17" font-weight="800">Multi-Cloud &amp; Dis…</text>
    <text x="60" y="85" fill="#575e70" font-family="'Inter', sans-serif" font-size="14" font-weight="600">⏱ 10 Days</text>
  </g>

  <!-- Phase 10 -->
  <g transform="translate(1360, 700)" filter="url(#softShadow)">
    <polygon points="0,0 360,0 400,60 360,120 0,120 40,60" fill="url(#chevronFill)" stroke="#10b981" stroke-width="3" />
    <rect x="52" y="24" width="36" height="28" rx="6" fill="#ecfdf5" />
    <text x="70" y="44" text-anchor="middle" fill="#059669" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900">10</text>
    <text x="96" y="45" fill="#191c1e" font-family="'Montserrat', sans-serif" font-size="17" font-weight="800">Production Capsto…</text>
    <text x="60" y="85" fill="#575e70" font-family="'Inter', sans-serif" font-size="14" font-weight="600">⏱ 10 Days • Capstone</text>
