    <text x="120" y="45" fill="#191c1e" font-family="'Montserrat', sans-serif" font-size="19" font-weight="800">Serverless &amp; Event-Driv…</text>
    <text x="80" y="85" fill="#575e70" font-family="'Inter', sans-serif" font-size="15" font-weight="600">⏱ 10 Days • Serverless Compute</text>
