<!-- ELEVATE Career Roadmap - Blue & White Home Theme -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8faff" />
      <stop offset="100%" stop-color="#f1f5fd" />
    </linearGradient>

    <!-- Chevron Body Fill Gradient -->
    <linearGradient id="chevronFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8faff" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4353cf" flood-opacity="0.12" />
    </filter>

    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#24389c" flood-opacity="0.25" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5edff" stroke-width="1" stroke-opacity="0.7" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#gridPattern)" />

  <!-- Outer Elegant Frame -->
  <rect x="24" y="24" width="1872" height="1032" rx="24" fill="none" stroke="#e0e7ff" stroke-width="2" />

  <!-- Ambient Decorative Glow Circles -->
  <circle cx="200" cy="180" r="260" fill="#4353cf" fill-opacity="0.04" filter="blur(60px)" />
  <circle cx="1720" cy="850" r="280" fill="#2563eb" fill-opacity="0.04" filter="blur(60px)" />

  <!-- ── Header Section ── -->
  <g transform="translate(960, 50)">
    <!-- Pill Badge -->
    <rect x="-180" y="0" width="360" height="38" rx="19" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
    <text x="0" y="24" text-anchor="middle" fill="#4353cf" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" letter-spacing="3">TRACK 04 • ELEVATE CAREER ROADMAP</text>
    
    <!-- Title -->
    <text x="0" y="85" text-anchor="middle" fill="#191c1e" font-family="'Montserrat', sans-serif" font-size="44" font-weight="900" letter-spacing="1">CLOUD ENGINEER ROADMAP</text>
    
    <!-- Subtitle -->
    <text x="0" y="122" text-anchor="middle" fill="#575e70" font-family="'Inter', sans-serif" font-size="16" font-weight="500">10 Structured Sequential Phases • Industry Benchmark Curriculum</text>
  </g>

  <!-- ── Serpentine Connective Rails (Home Page Blue #4353cf) ── -->
