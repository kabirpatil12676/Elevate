    <line x1="-300" y1="0" x2="300" y2="0" stroke="#e0e7ff" stroke-width="1.5" />
    <text x="0" y="26" text-anchor="middle" fill="#575e70" font-family="'Inter', sans-serif" font-size="14" font-weight="600">ELEVATE Digital Learning • Industry-Aligned Tech Roadmaps • elevate.edu</text>
