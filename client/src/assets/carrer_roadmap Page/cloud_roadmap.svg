    <circle cx="70" cy="70" r="70" fill="url(#bgGrad)" stroke="#10b981" stroke-width="6" />
    <circle cx="70" cy="70" r="54" fill="#10b981" />
    <text x="70" y="65" text-anchor="middle" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="17" font-weight="900" letter-spacing="1">HIRED</text>
    <text x="70" y="85" text-anchor="middle" fill="#ecfdf5" font-family="'Inter', sans-serif" font-size="11" font-weight="700">READY</text>
