    <rect x="52" y="24" width="36" height="28" rx="6" fill="#eef2ff" />
    <text x="70" y="44" text-anchor="middle" fill="#1d4ed8" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900">03</text>
    <text x="100" y="45" fill="#191c1e" font-family="'Montserrat', sans-serif" font-size="19" font-weight="800">IAM Security &amp; Acce…</text>
