    <text x="100" y="45" fill="#191c1e" font-family="'Montserrat', sans-serif" font-size="19" font-weight="800">Linux &amp; Server Administ…</text>
    <text x="60" y="85" fill="#575e70" font-family="'Inter', sans-serif" font-size="15" font-weight="600">⏱ 10 Days • Server Core</text>
