    <text x="70" y="44" text-anchor="middle" fill="#4353cf" font-family="'Montserrat', sans-serif" font-size="18" font-weight="900">01</text>
    <text x="100" y="45" fill="#191c1e" font-family="'Montserrat', sans-serif" font-size="19" font-weight="800">Cloud Fundamentals &amp; Ne…</text>
